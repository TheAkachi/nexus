name: Verificar P3
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: primig_test
          POSTGRES_PASSWORD: test_only_not_for_production
          POSTGRES_DB: primig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U primig_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://primig_test:test_only_not_for_production@127.0.0.1:5432/primig_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test --test-concurrency=1 tests/api/site.test.mjs
